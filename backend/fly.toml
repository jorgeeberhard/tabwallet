# Fly.io configuration of the API (https://tabwallet-api.fly.dev).
# Deployed by .github/workflows/deploy.yml, from this directory:
#   fly deploy --remote-only --config fly.toml
# Secrets (DATABASE_URL, JWT_SECRET, APP_URL, EMAIL_*) live in Fly, set with
# `fly secrets set`; nothing secret belongs in this file. APP_ENV and
# COOKIE_SECURE are deliberately not set: their defaults are the production ones.

app = "tabwallet-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDR = "0.0.0.0:8080"
  RUST_LOG = "info"

[deploy]
  # Blue-green: the new version boots next to the old one and only takes the
  # traffic after its health check passes. If it never does, the deploy fails
  # and the old version keeps serving. (The API applies its migrations on
  # startup, so they are written to work with the old version too.)
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine always running: no scale to zero, so no cold start for users.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    # Time for the start, the migrations and a Neon database waking up.
    grace_period = "30s"
    interval = "30s"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
