name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Require the checks named "backend" and "frontend" on `main`.
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # PostgreSQL with TLS and a self-signed certificate, like the managed
      # database in production, for tests/postgres_tls.rs (same recipe as
      # start_tls_postgres in backend/scripts/_docker.sh).
      - name: Start PostgreSQL with TLS
        run: |
          docker run -d --name postgres-tls -e POSTGRES_PASSWORD=postgres \
            -p 127.0.0.1:5433:5432 --entrypoint sh postgres:17-alpine -c '
              apk add --no-cache openssl >/dev/null
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=localhost \
                -keyout /tmp/server.key -out /tmp/server.crt 2>/dev/null
              chown postgres:postgres /tmp/server.key /tmp/server.crt
              chmod 600 /tmp/server.key
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key'
          for _ in $(seq 1 60); do
            docker exec postgres-tls pg_isready -h 127.0.0.1 -U postgres -q && exit 0
            sleep 1
          done
          docker logs postgres-tls
          exit 1

      # The other integration tests start PostgreSQL through testcontainers,
      # which uses the Docker daemon already present on the runner.
      - name: Test
        run: cargo test
        env:
          TEST_TLS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Catches build-time errors that type-check and lint do not.
      - name: Build
        run: npm run build
